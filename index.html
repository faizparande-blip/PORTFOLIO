<!doctype html>
<html lang="en" class="scroll-smooth dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Muhammad Faiz Parande | Full-Stack Developer & Data Analyst</title>
    <meta name="description" content="Personal portfolio of Muhammad Faiz Parande — Computer Science Engineer, Full-Stack Developer, Data Analyst, and Data Scientist specializing in scalable web systems and data-driven applications." />
    <meta name="theme-color" content="#050B14" />
    <meta property="og:title" content="Muhammad Faiz Parande | Full-Stack Developer & Data Analyst" />
    <meta property="og:description" content="Computer Science Engineer, Full-Stack Developer, Data Analyst, and Data Scientist." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#050B14] text-[#F8FAFC] antialiased selection:bg-cyan-500/20 selection:text-cyan-300 min-h-screen">
    <div id="root">
      <!-- Instant Zero-JS Technical System Loader (Rendered in <30ms, replaced when React mounts) -->
      <div id="initial-loader" style="position:fixed;inset:0;background-color:#050B14;color:#F8FAFC;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;z-index:9999;padding:1.5rem;text-align:center;box-sizing:border-box;">
        <style>
          @keyframes pulse-ring {
            0%, 100% { transform: scale(1); opacity: 0.85; }
            50% { transform: scale(1.06); opacity: 1; }
          }
          @keyframes laser-sweep {
            0% { transform: translateX(-100%); }
            50% { transform: translateX(35%); }
            100% { transform: translateX(100%); }
          }
          @keyframes rotate-border {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
          }
        </style>
        
        <!-- Outer ambient radial depth -->
        <div style="position:absolute;width:280px;height:280px;background:radial-gradient(circle,rgba(34,211,238,0.15) 0%,transparent 70%);border-radius:50%;pointer-events:none;"></div>

        <!-- Center Monogram Badge -->
        <div style="position:relative;width:56px;height:56px;margin-bottom:1.25rem;display:flex;align-items:center;justify-content:center;">
          <div style="position:absolute;inset:0;border:1.5px dashed rgba(34,211,238,0.4);border-radius:14px;animation:rotate-border 8s linear infinite;"></div>
          <div style="width:38px;height:38px;background:#00D9FF;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#050B14;font-weight:800;font-size:15px;font-family:monospace;box-shadow:0 0 20px rgba(0,217,255,0.4);animation:pulse-ring 2s ease-in-out infinite;">
            FP
          </div>
        </div>

        <!-- Identity & Status -->
        <div style="font-size:10px;font-family:monospace;letter-spacing:0.2em;color:#22D3EE;text-transform:uppercase;font-weight:700;margin-bottom:0.35rem;">
          SYSTEM INITIALIZING
        </div>
        <div style="font-size:18px;font-weight:800;color:#FFFFFF;letter-spacing:-0.02em;margin-bottom:0.25rem;">
          MUHAMMAD FAIZ PARANDE
        </div>
        <div style="font-size:11px;color:#94A3B8;font-family:monospace;margin-bottom:1.5rem;">
          FULL-STACK DEVELOPER &amp; DATA ANALYST
        </div>

        <!-- Laser Progress Track -->
        <div style="width:100%;max-width:240px;height:3px;background:#0B1726;border-radius:99px;overflow:hidden;border:1px solid rgba(148,163,184,0.15);position:relative;margin-bottom:1rem;">
          <div style="position:absolute;top:0;left:0;bottom:0;width:50%;background:linear-gradient(90deg,transparent,#00D9FF,#22D3EE);border-radius:99px;box-shadow:0 0 10px #00D9FF;animation:laser-sweep 1.2s cubic-bezier(0.4,0,0.2,1) infinite;"></div>
        </div>

        <!-- Status Subtext -->
        <div style="font-size:10px;color:#64748B;font-family:monospace;display:flex;align-items:center;gap:6px;">
          <span style="width:6px;height:6px;background:#00D9FF;border-radius:50%;display:inline-block;box-shadow:0 0 6px #00D9FF;"></span>
          <span>INITIALIZING WORKSPACE // READY</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
